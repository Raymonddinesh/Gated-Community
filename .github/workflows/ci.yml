name: SocietySphere CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-checks:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-dev.txt

      - name: Backend Lint Check (Ruff)
        run: |
          ruff check apps/api tests
          ruff format --check apps/api tests

      - name: Backend Type Check (Mypy)
        run: |
          mypy apps/api tests

      - name: Run Backend Pytest Suite
        run: |
          pytest -v --cov=apps/api/src --cov-report=xml

  frontend-checks:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Frontend Lint Check
        working-directory: apps/web
        run: npm run lint

      - name: Frontend Type Check
        working-directory: apps/web
        run: npm run typecheck

      - name: Frontend Build Verification
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
